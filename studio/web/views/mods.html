<section id="mods" class="view">
  <div class="section-heading">
    <div>
      <h1>Mod packs</h1>
      <p>
        Enable modules and save settings. The game reloads them live; no plugin
        rebuild.
      </p>
    </div>
  </div>
  <div class="toolbar">
    <div id="filters" class="filters" aria-label="Filter modules"></div>
    <label class="search-label"
      ><span class="sr-only">Search packs, modules and settings</span
      ><input
        id="mod-search"
        type="search"
        placeholder="Search modules and settings…"
    /></label>
  </div>
  <div class="module-library-meta">
    <span id="module-count" class="muted" role="status">Loading modules…</span>
    <div class="library-actions">
      <button
        id="apply-adjustments"
        class="secondary"
        aria-pressed="false"
        title="Automatically save setting edits for modules that are already enabled. Module enable and disable changes still need Save changes."
      >
        Apply as you adjust · Off</button
      ><button id="show-enabled" class="secondary" aria-pressed="false">
        Enabled modules · 0</button
      ><button id="disable-all-enabled" class="quiet" hidden>
        Disable all unlocked
      </button>
      <div
        class="accordion-actions"
        role="group"
        aria-label="Accordion controls"
      >
        <button id="expand-all-accordions" class="secondary">Expand all</button
        ><button id="collapse-all-accordions" class="secondary">
          Collapse all
        </button>
      </div>
    </div>
  </div>
  <div id="settings-error" class="settings-error" role="alert" hidden>
    <p id="settings-error-message"></p>
    <button id="reload-settings" class="secondary" hidden>
      Reload conflicting settings
    </button>
  </div>
  <div id="feature-list" class="feature-list" aria-live="polite">
    <p>Loading your toolkit…</p>
  </div>
  <section id="recipe-controls"></section>
  <div class="save-footer">
    <span id="settings-state" role="status">All changes saved.</span>
    <div class="save-actions">
      <button id="launch-game" class="secondary" disabled>Launch game</button
      ><button id="save-settings" class="primary" disabled>Save changes</button>
    </div>
  </div>
</section>

<section id="workshop" class="view" hidden>
  <div class="section-heading">
    <div>
      <h1>Workshop</h1>
      <p>Edit a module, explore game APIs, or create your first recipe.</p>
    </div>
  </div>
  <div class="workshop-tabs" role="tablist" aria-label="Workshop tools">
    <button
      id="tab-editor"
      class="workshop-tab selected"
      role="tab"
      aria-selected="true"
      aria-controls="panel-editor"
      data-workshop="editor"
    >
      Module editor
    </button>
    <button
      id="tab-api"
      class="workshop-tab"
      role="tab"
      aria-selected="false"
      aria-controls="panel-api"
      data-workshop="api"
      tabindex="-1"
    >
      Game API reference
    </button>
    <button
      id="tab-sharing"
      class="workshop-tab"
      role="tab"
      aria-selected="false"
      aria-controls="panel-sharing"
      data-workshop="sharing"
      tabindex="-1"
    >
      Share modules
    </button>
    <button
      id="tab-tutorial"
      class="workshop-tab"
      role="tab"
      aria-selected="false"
      aria-controls="panel-tutorial"
      data-workshop="tutorial"
      tabindex="-1"
    >
      First mod tutorial
    </button>
  </div>

  <!-- @include ./editor.html -->
  <!-- @include ./api.html -->
  <!-- @include ./sharing.html -->
  <!-- @include ./tutorial.html -->
</section>
